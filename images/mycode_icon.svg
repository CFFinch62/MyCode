<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" ry="48" fill="#1a1a2e"/>
  
  <!-- Subtle grid/code background lines -->
  <line x1="0" y1="72" x2="256" y2="72" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="128" x2="256" y2="128" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="184" x2="256" y2="184" stroke="#ffffff08" stroke-width="1"/>

  <!-- Left angle bracket < -->
  <polyline points="72,88 40,128 72,168" fill="none" stroke="#4fc3f7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right angle bracket > -->
  <polyline points="184,88 216,128 184,168" fill="none" stroke="#4fc3f7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "MC" centered -->
  <text x="128" y="128" 
        font-family="'Courier New', Courier, monospace" 
        font-size="72" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="middle">MC</text>
</svg>
